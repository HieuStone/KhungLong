<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flora preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec5d8; font-family: sans-serif; }
  #info { position: fixed; top: 8px; left: 8px; background: rgba(255,255,255,.8); padding: 4px 8px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div id="info"></div>
<script type="module">
// Xem trước cây/đá. ?v=trees | small | rocks | world  (world: thế giới thật + terrain)
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { ROCK_KINDS, getWorld, heightAt } from '@isle/shared';
import { createFlora, createFloraFrom } from './flora.js';
import { createTerrain } from './terrain.js';

const q = new URLSearchParams(location.search);
const view = q.get('v') || 'trees';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec5d8);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 800);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(15, 30, 20);
scene.add(sun);

const t0 = performance.now();
let flora;
if (view === 'world') {
  createTerrain(scene);
  flora = createFlora(scene);
  const pl = getWorld().plants.filter((p) => p.kind === 'broadleaf' && p.y > 3);
  const c = pl[+(q.get('i') || 0) % pl.length];
  const cx = +(q.get('x') ?? c.x), cz = +(q.get('z') ?? c.z);
  camera.position.set(cx + 22, heightAt(cx, cz) + 12, cz + 22);
  controls.target.set(cx, heightAt(cx, cz) + 3, cz);
} else {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x5f8f48 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const plants = [], rocks = [];
  if (view === 'trees' || view === 'small') {
    const kinds = view === 'trees' ? ['pine', 'broadleaf', 'palm', 'dead'] : ['fern', 'bush'];
    const defs = { pine: 10, broadleaf: 8, palm: 7, dead: 5.5, fern: 1.6, bush: 1.2 };
    const gap = view === 'trees' ? 9 : 3;
    kinds.forEach((kind, ki) => {
      for (let j = 0; j < (view === 'trees' ? 2 : 3); j++) {
        const s = [1, 1.4, 0.8][j];
        plants.push({ kind, x: (ki - (kinds.length - 1) / 2) * gap, y: 0, z: j * gap * 0.9, rot: j * 2.1 + ki, scale: s, r: 0, h: defs[kind] * s });
      }
    });
    if (view === 'trees') { camera.position.set(0, 10, 44); controls.target.set(0, 4.5, 4); }
    else { camera.position.set(0, 3.5, 13); controls.target.set(0, 0.6, 2); }
  } else {
    ROCK_KINDS.forEach((kind, ki) => {
      for (let s = 0; s < 4; s++) {
        const w = { boulder: 2.2, rock: 1, slab: 2, spire: 1.1, pebbles: 0.6 }[kind];
        const hgt = { boulder: 2.4, rock: 0.9, slab: 0.6, spire: 5, pebbles: 0.3 }[kind];
        rocks.push({ kind, x: (s - 1.5) * 6, y: 0, z: (ki - 2) * 6, w, hgt, rotX: 0.1, rotY: s * 1.3, seed: s, r: 0 });
      }
    });
    camera.position.set(0, 16, 26); controls.target.set(0, 0.5, 0);
  }
  flora = createFloraFrom(scene, plants, rocks);
}
controls.update();
document.getElementById('info').textContent = `view=${view} build ${(performance.now() - t0).toFixed(0)}ms draw calls ${flora.drawCalls ?? '?'}`;
console.log('build ms', performance.now() - t0, 'draws', flora.drawCalls);

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
renderer.setAnimationLoop((t) => { flora.update(t / 1000); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
