<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111111" />
  <title>Isle Lite</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    canvas { touch-action: none; }
    #menu { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: flex-start; touch-action: pan-y; background: #111c; color: #fff; z-index: 10; overflow-y: auto; padding: 12px; box-sizing: border-box; }
    #menu.hidden { display: none; }
    #menu > :first-child { margin-top: auto; } #menu > :last-child { margin-bottom: auto; } /* căn giữa nhưng vẫn cuộn được khi màn hình thấp */
    #menu h1 { margin: 0 0 4px; }
    #preview { width: 340px; height: 210px; max-width: 90vw; border-radius: 12px; background: radial-gradient(circle at 50% 35%, #3b5a3a, #152215); box-shadow: inset 0 0 0 1px #fff2; }
    .colors { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    #swatches { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 340px; }
    .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff4; cursor: pointer; padding: 0; }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #fff6; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 14px; }
    .row label { display: flex; gap: 6px; align-items: center; }
    input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid #fff5; border-radius: 6px; background: none; cursor: pointer; }
    #menu button, #menu select, #menu input[type=text], #menu input:not([type]) { font-size: 15px; padding: 6px 12px; }
    #note { color: #ffb4a8; min-height: 1.2em; }
    #play { font-size: 18px !important; padding: 10px 28px !important; }
    /* Điện thoại: chữ >= 16px để iPhone không tự phóng to khi gõ; màn hình thấp (xoay ngang) thì thu nhỏ khung xem trước */
    @media (pointer: coarse) { #menu input, #menu select, #menu button { font-size: 16px !important; } .sw { width: 32px; height: 32px; } }
    @media (max-height: 520px) { #preview { width: 240px; height: 140px; } #menu h1 { font-size: 22px; } #menu { gap: 6px; } }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Isle Lite</h1>
    <input id="name" placeholder="Tên" maxlength="16" />
    <select id="species"></select>
    <canvas id="preview" width="680" height="420"></canvas>
    <div class="colors">
      <div id="swatches" title="Chọn nhanh màu thân"></div>
      <div class="row">
        <label>Màu thân <input type="color" id="colBody" /></label>
        <label>Điểm nhấn <input type="color" id="colAccent" /></label>
      </div>
      <div class="row">
        <button id="colDefault" type="button">Màu mặc định</button>
        <button id="colRandom" type="button">Ngẫu nhiên</button>
      </div>
    </div>
    <button id="play">Vào game</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
